[workspace]
members = ["harness/rust", "implementations/rust/*"]
# Vendored Rust crates (rav1d, ssimulacra2, jxl-rs) declare their own workspaces;
# exclude them so cargo resolves their workspace-inherited settings against their
# own roots rather than this one.
exclude = ["vendor"]
resolver = "2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Full DWARF for every crate is a large share of how fast target/ grows in a
# quick edit-build loop. Workspace crates keep line tables, so their backtraces
# and panics still carry file:line (but a debugger shows no locals); dependency
# frames keep their symbol names but lose file:line. `cargo test` inherits both
# settings. Benchmarks build with --release, so they are unaffected. For full
# debug info, override per invocation:
# CARGO_PROFILE_DEV_DEBUG=2 for the workspace, and/or
# `cargo --config 'profile.dev.package."*".debug=2' ...` for dependencies.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
